<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>へんな診断研究所｜6つの診断が遊べる</title><style>:root{--ink:#23483d;--paper:#f8f4e9;--gold:#e6b65e;--muted:#6d786c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN',sans-serif}header{border-bottom:2px solid var(--ink);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;max-width:1100px;margin:auto}.brand{font-weight:900;font-size:19px;letter-spacing:-.06em}.stamp{border:1.5px solid var(--ink);padding:5px 8px;border-radius:3px;font-size:10px;transform:rotate(-5deg)}main{max-width:1050px;margin:auto;padding:0 18px 70px}.hero{position:relative;padding:62px 8px 52px;text-align:center;border-bottom:1px dashed #a8b2a1}.eyebrow{letter-spacing:.2em;font-size:11px;font-weight:800}.hero h1{font-size:clamp(37px,8vw,72px);line-height:1.23;letter-spacing:-.09em;margin:18px 0}.hero p{line-height:1.9;color:#56675c}.mascot{display:inline-flex;align-items:center;justify-content:center;width:84px;height:84px;border-radius:50%;background:#d6e2cf;border:2px solid var(--ink);font-size:40px;transform:rotate(-10deg);box-shadow:7px 7px 0 #e5d8b5}.pill{display:inline-block;background:var(--gold);color:#263d34;padding:7px 13px;font-size:12px;font-weight:800;border-radius:100px;margin-top:15px}.section-head{display:flex;align-items:end;justify-content:space-between;margin:38px 0 18px}.section-head h2{margin:0;font-size:24px;letter-spacing:-.06em}.section-head small{color:var(--muted)}.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:15px}.filter{border:1px solid #bdc9b9;background:transparent;color:var(--ink);border-radius:30px;padding:9px 15px;white-space:nowrap;font-weight:700;cursor:pointer}.filter.active{background:var(--ink);color:white}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:#fffdf7;border:1.5px solid #d4d7c9;border-radius:13px;overflow:hidden;display:flex;flex-direction:column}.art{height:155px;display:flex;align-items:center;justify-content:center;font-size:68px;background:#e6ebd8;position:relative}.card:nth-child(2n) .art{background:#f3e2cc}.card:nth-child(3n) .art{background:#e6e1ec}.art:after{content:'研究資料';position:absolute;left:13px;top:13px;border:1px solid #667d6b;padding:3px 6px;font-size:10px;letter-spacing:.1em}.card-body{padding:17px;display:flex;flex:1;flex-direction:column}.category{font-size:11px;color:#7c897b;font-weight:800}.card h3{font-size:19px;line-height:1.5;margin:7px 0}.card p{font-size:13px;color:#67766b;line-height:1.8;margin:0 0 20px;flex:1}.card button,.primary{background:var(--ink);color:white;border:0;border-radius:7px;padding:13px 16px;font-size:14px;font-weight:800;cursor:pointer;width:100%}.card button:disabled{background:#aab4a7;cursor:default}.notice{margin-top:38px;background:#e9eadb;padding:20px;border-radius:9px;line-height:1.8;font-size:13px}.footer{text-align:center;font-size:11px;color:#819083;margin-top:40px}.screen{display:none;max-width:650px;margin:35px auto}.screen.active{display:block}.back{background:none;border:0;color:var(--ink);font-weight:800;font-size:14px;cursor:pointer;margin-bottom:24px}.panel{background:#fffdf7;border:1.5px solid #d4d7c9;border-radius:16px;padding:27px}.progress{height:8px;background:#e6eadf;border-radius:10px;overflow:hidden;margin:20px 0 28px}.progress span{display:block;height:100%;background:#d6a753;transition:width .25s}.question{font-size:25px;line-height:1.5;font-weight:900;letter-spacing:-.04em;margin:0 0 25px}.answers{display:grid;gap:11px}.answers button{background:#f7f4eb;color:var(--ink);border:1.5px solid #c9d1c4;border-radius:9px;text-align:left;padding:17px;font-size:15px;font-weight:700;cursor:pointer}.answers button:active{background:#dbe6d5}.result-emoji{font-size:85px;text-align:center;margin:14px 0}.result-title{text-align:center;font-size:28px;font-weight:900}.result-text{text-align:center;line-height:2;color:#586a5d}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}.secondary{background:#e9eddf;color:var(--ink);border:1px solid #b8c5b4;border-radius:7px;padding:13px;font-weight:800;cursor:pointer}.hide{display:none!important}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr);gap:10px}.art{height:115px;font-size:48px}.card-body{padding:12px}.card h3{font-size:16px}.card p{font-size:12px}.hero{padding:45px 0}.panel{padding:20px}}@media(max-width:360px){.cards{grid-template-columns:1fr}}</style></head><body><header><div class="brand">◉ へんな診断研究所</div><div class="stamp">非公式研究機関</div></header><main><div id="home"><section class="hero"><div class="mascot">🔬</div><div class="eyebrow" style="margin-top:28px">WELCOME TO THE STRANGE LAB.</div><h1>あなたのこと、<br>勝手に研究します。</h1><p>どうでもいいことを、大真面目に。<br>ちょっと変な診断が集まる研究所です。</p><span class="pill">入場無料 ・ 会員登録不要</span></section><div class="section-head"><h2>研究テーマ一覧</h2><small id="count">6件の研究</small></div><div class="filters" id="filters"></div><div class="cards" id="cards"></div><div class="notice"><b>📋 研究所からのお知らせ</b><br>ここにある診断は娯楽用です。医学的・科学的な性格判定ではありません。現在は試作版です。6つの研究を公開しています。</div></div><section id="quiz" class="screen"><button class="back" onclick="goHome()">← 研究テーマ一覧へ戻る</button><div class="panel"><div class="eyebrow" id="step"></div><div class="progress"><span id="bar"></span></div><h2 class="question" id="question"></h2><div class="answers" id="answers"></div></div></section><section id="result" class="screen"><button class="back" onclick="goHome()">← 研究テーマ一覧へ戻る</button><div class="panel"><div class="eyebrow" style="text-align:center"><span id="reportNumber">極秘研究報告書 No.001</span></div><div class="result-emoji" id="resultEmoji"></div><div class="result-title" id="resultTitle"></div><p class="result-text" id="resultText"></p><div class="actions"><button class="secondary" onclick="shareResult()">結果をシェア</button><button class="primary" onclick="goHome()">別の診断へ</button></div></div></section><div class="footer">© へんな診断研究所 / 研究結果には個人差があります。</div></main><script>const tests=[{"title": "あなたの不憫度診断", "category": "おもしろ", "emoji": "☔", "desc": "なぜか損しがちなあなた。その不憫さを研究します。", "questions": [{"q": "雨の日、傘を持って出たら晴れた。", "a": [["まあ、よかった", 0], ["傘が荷物になった…", 1], ["帰りは降る気がする", 2]]}, {"q": "楽しみにしていたお菓子が最後の1個。", "a": [["迷わず食べる", 0], ["誰かに譲ってしまう", 1], ["気づいたら誰かに食べられてる", 2]]}, {"q": "写真を撮ったら自分だけ目を閉じていた。", "a": [["撮り直してもらう", 0], ["そのままでいいと言う", 1], ["なぜか毎回そうなる", 2]]}, {"q": "列に並ぶとき、どんなことが多い？", "a": [["普通に順番が来る", 0], ["自分の列だけ遅い気がする", 1], ["並んだ途端に受付終了", 2]]}, {"q": "新品の服を着た日の出来事は？", "a": [["特に何もない", 0], ["小さな汚れがつく", 1], ["誰にも気づいてもらえない", 2]]}, {"q": "友達とくじを引くと…", "a": [["けっこう当たる", 0], ["だいたいハズレ", 1], ["ハズレなのに変な景品が来る", 2]]}, {"q": "予定が急になくなったら？", "a": [["自由時間ができてうれしい", 0], ["準備したのに…と思う", 1], ["家を出た直後に連絡が来る", 2]]}], "results": [{"emoji": "🍀", "title": "なぜか得する研究対象", "text": "不憫度20％。不運をするりとかわすタイプ。研究所ではその運のよさを不審に思っています。"}, {"emoji": "🧦", "title": "片方だけ靴下が消える人", "text": "不憫度65％。小さな「なんで自分だけ？」が積み重なりがち。報われる日は、たぶん明日。"}, {"emoji": "☔", "title": "雨雲に愛されし伝説", "text": "不憫度95％。なぜかあなたのところだけ小雨が降るタイプ。でも、そんな出来事まで笑い話にできるのが才能。"}]}, {"title": "人生のモブキャラ度診断", "category": "おもしろ", "emoji": "🎭", "desc": "あなたは物語の主人公？ それとも通りすがりの人？", "questions": [{"q": "集合写真ではどこに立つ？", "a": [["真ん中でポーズ", 0], ["端っこが落ち着く", 1], ["撮影係になっている", 2]]}, {"q": "ドラマの街角にいたら？", "a": [["事件に首を突っ込む", 0], ["通りすがりに一言", 1], ["背景でパンを買ってる", 2]]}, {"q": "友達との予定を決めるときは？", "a": [["行き先を提案する", 0], ["みんなに合わせる", 1], ["気づけば集合場所だけ知らない", 2]]}, {"q": "知らない人に道を聞かれたら？", "a": [["先導して案内", 0], ["丁寧に説明", 1], ["自分も迷っている", 2]]}, {"q": "物語の決めゼリフを言うなら？", "a": [["「ここは任せて！」", 0], ["「そうなんだ」", 1], ["「あ、袋いります？」", 2]]}, {"q": "突然スポットライトが当たったら？", "a": [["堂々と手を振る", 0], ["周りを見回す", 1], ["照明の故障を疑う", 2]]}], "results": [{"emoji": "🌟", "title": "エンドロールの一番上", "text": "モブ度15％。気づけば中心にいるタイプ。研究所のカメラもあなたを追っています。"}, {"emoji": "🎬", "title": "名脇役のプロ", "text": "モブ度60％。必要な場面にちょうど現れる人。あなたがいないと物語が少し困ります。"}, {"emoji": "🥖", "title": "背景のパン屋さん", "text": "モブ度98％。大事件の隣で焼きたてパンを選ぶ人。なのに、なぜか一番気になる存在です。"}]}, {"title": "恋愛こじらせ度診断", "category": "恋愛", "emoji": "💌", "desc": "好きな人の前で、ついしてしまう行動を研究。", "questions": [{"q": "気になる人から「おはよう」が届いた！", "a": [["普通に返す", 0], ["返信文を何回か直す", 1], ["一度スマホを伏せる", 2]]}, {"q": "会話が急に途切れたら？", "a": [["別の話題を出す", 0], ["少し様子を見る", 1], ["頭の中で反省会を開く", 2]]}, {"q": "好きな人の前で褒められると？", "a": [["素直に喜ぶ", 0], ["照れて話をそらす", 1], ["なぜか変な冗談を言う", 2]]}, {"q": "待ち合わせに早く着いたら？", "a": [["近くを散歩する", 0], ["身だしなみを確認", 1], ["偶然来たふりを練習", 2]]}, {"q": "気になる人と目が合ったら？", "a": [["笑顔を返す", 0], ["ちょっとそらす", 1], ["急に壁の模様を見る", 2]]}, {"q": "会話を思い返すのは？", "a": [["ほとんどしない", 0], ["楽しかった部分だけ", 1], ["一言一句、脳内で再生", 2]]}], "results": [{"emoji": "💐", "title": "素直な花束タイプ", "text": "こじらせ度15％。気持ちを自然に表現できるタイプ。研究員もその落ち着きを見習いたいそうです。"}, {"emoji": "📮", "title": "下書き保存タイプ", "text": "こじらせ度55％。少し考えすぎるけれど、相手を大事にしたい気持ちの表れかも。"}, {"emoji": "🌀", "title": "脳内会議が終わらないタイプ", "text": "こじらせ度95％。たった一言で議題が12個増える人。議長はあなた、書記もあなた。"}]}, {"title": "迷い込む異世界診断", "category": "ミステリー", "emoji": "🚪", "desc": "もしも謎の扉を開けたら、どんな世界に着く？", "questions": [{"q": "夜道に古い扉を見つけた。", "a": [["ノックする", 0], ["周囲を観察", 1], ["迷わず開ける", 2]]}, {"q": "不思議な街で最初に探すのは？", "a": [["人がいる場所", 0], ["地図や看板", 1], ["おもしろそうな店", 2]]}, {"q": "空から降ってきたのは？", "a": [["紙の手紙", 0], ["青い鍵", 1], ["小さな星", 2]]}, {"q": "時間が止まったら？", "a": [["原因を調べる", 0], ["静けさを楽しむ", 1], ["好きな場所を探検", 2]]}, {"q": "道案内する生き物は？", "a": [["話す猫", 0], ["無口なフクロウ", 1], ["踊るきのこ", 2]]}, {"q": "帰り道が見つからないときは？", "a": [["誰かと協力", 0], ["手がかりを集める", 1], ["もう少し散歩する", 2]]}, {"q": "異世界から持ち帰るなら？", "a": [["誰かの手紙", 0], ["謎の羅針盤", 1], ["光るお菓子", 2]]}], "results": [{"emoji": "🌆", "title": "永遠に夕方の街", "text": "夕焼けが消えない街に到着。駅の時計はずっと17時03分。帰りの電車だけ、なぜか毎日遅延中。"}, {"emoji": "📚", "title": "忘れられた図書館", "text": "本を開くたび、まだ起きていない出来事が書かれています。司書は「最後のページだけ読まないで」と言いました。"}, {"emoji": "🎡", "title": "月の裏側の遊園地", "text": "誰もいない観覧車がゆっくり回っています。入場券には、あなたの名前が最初から印刷されていました。"}]}, {"title": "本当の自分を動物に例えると？", "category": "性格", "emoji": "🦊", "desc": "あなたの行動パターンを、動物に例えてみます。", "questions": [{"q": "休日の朝は？", "a": [["早起きして出発", 0], ["ゆっくり準備", 1], ["昼まで寝たい", 2]]}, {"q": "初めての場所では？", "a": [["とりあえず歩く", 0], ["案内を確認", 1], ["落ち着く隅を探す", 2]]}, {"q": "グループでの役割は？", "a": [["盛り上げ役", 0], ["相談役", 1], ["自由行動担当", 2]]}, {"q": "好きなものを見つけたら？", "a": [["すぐ試す", 0], ["じっくり調べる", 1], ["こっそり大切にする", 2]]}, {"q": "予定が急に変わると？", "a": [["むしろ楽しい", 0], ["計画を立て直す", 1], ["少し休憩したい", 2]]}, {"q": "友達に言われがちなことは？", "a": [["行動力あるね", 0], ["頼りになるね", 1], ["マイペースだね", 2]]}], "results": [{"emoji": "🐿️", "title": "好奇心リス", "text": "気になることがあればすぐ動くタイプ。研究所の備品を勝手に集めていないか、確認されています。"}, {"emoji": "🦉", "title": "観察上手フクロウ", "text": "周りをよく見て判断するタイプ。誰より冷静なのに、たまに謎のこだわりを発揮します。"}, {"emoji": "🦦", "title": "のんびりラッコ", "text": "自分のペースを大切にするタイプ。研究所のソファを一番使いこなせる才能があります。"}]}, {"title": "ホラー映画の生存タイプ診断", "category": "ミステリー", "emoji": "👻", "desc": "映画の中であなたはどんな役割になる？", "questions": [{"q": "古い洋館で物音がしたら？", "a": [["みんなを集める", 0], ["音の正体を調べる", 1], ["とりあえず帰る", 2]]}, {"q": "怪しいメモを見つけたら？", "a": [["全員に共有", 0], ["内容を整理", 1], ["写真だけ撮って離れる", 2]]}, {"q": "友達が別行動を提案したら？", "a": [["一緒に行こうと言う", 0], ["役割を決める", 1], ["絶対に分かれない", 2]]}, {"q": "突然停電したら？", "a": [["落ち着いて声をかける", 0], ["ライトを探す", 1], ["出口の位置を確認", 2]]}, {"q": "不思議な人に話しかけられたら？", "a": [["普通に話す", 0], ["質問してみる", 1], ["距離を保つ", 2]]}, {"q": "映画のラストに残したいものは？", "a": [["仲間との写真", 0], ["解明した謎", 1], ["無事に帰った記録", 2]]}], "results": [{"emoji": "🛡️", "title": "みんなを守るまとめ役", "text": "映画の中でも仲間を気にかけるタイプ。エンドロールには感謝の名前がずらり。"}, {"emoji": "🔎", "title": "謎を解く考察担当", "text": "細かい違和感を見逃さないタイプ。最後に伏線を全部回収して拍手を浴びそう。"}, {"emoji": "🚕", "title": "開始10分で帰宅する賢者", "text": "「嫌な予感がする」で帰るタイプ。映画にはあまり映らないけど、翌朝は普通にパンを食べています。"}]}];
let category='すべて',current=0,index=0,score=0,lastResult=null;
function render(){
 document.getElementById('filters').innerHTML=['すべて','おもしろ','性格','恋愛','ミステリー'].map(c=>`<button class="filter ${category===c?'active':''}" onclick="setCategory('${c}')">${c}</button>`).join('');
 const visible=tests.map((t,i)=>({...t,id:i})).filter(t=>category==='すべて'||t.category===category);
 document.getElementById('count').textContent=visible.length+'件の研究';
 document.getElementById('cards').innerHTML=visible.map(t=>`<article class="card"><div class="art">${t.emoji}</div><div class="card-body"><span class="category">${t.category} / 公開中</span><h3>${t.title}</h3><p>${t.desc}</p><button onclick="startQuiz(${t.id})">診断をはじめる →</button></div></article>`).join('');
}
function setCategory(c){category=c;render()}
function show(id){['home','quiz','result'].forEach(s=>{document.getElementById(s).style.display=s===id?'block':'none'});window.scrollTo(0,0)}
function goHome(){show('home')}
function startQuiz(id){current=id;index=0;score=0;show('quiz');renderQuestion()}
function renderQuestion(){const test=tests[current],q=test.questions[index];document.getElementById('step').textContent=`${test.title} · QUESTION ${index+1} / ${test.questions.length}`;document.getElementById('bar').style.width=`${(index+1)/test.questions.length*100}%`;document.getElementById('question').textContent=q.q;document.getElementById('answers').innerHTML=q.a.map(([t,n])=>`<button onclick="answer(${n})">${t}　→</button>`).join('')}
function answer(n){score+=n;index++;if(index<tests[current].questions.length)renderQuestion();else finish()}
function finish(){const test=tests[current],max=test.questions.length*2,ratio=score/max;const result=test.results[ratio<.34?0:ratio<.67?1:2];lastResult={...result,quiz:test.title};document.getElementById('resultEmoji').textContent=result.emoji;document.getElementById('resultTitle').textContent=result.title;document.getElementById('resultText').textContent=result.text;document.getElementById('reportNumber').textContent=`極秘研究報告書 No.${String(current+1).padStart(3,'0')}`;show('result')}
async function shareResult(){if(!lastResult)return;const msg=`へんな診断研究所「${lastResult.quiz}」
結果：${lastResult.title}
${lastResult.text}`;if(navigator.share){try{await navigator.share({title:'へんな診断研究所',text:msg,url:location.protocol.startsWith('http')?location.href:undefined});return}catch(e){if(e.name==='AbortError')return}}if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(msg);alert('診断結果をコピーしました！');return}catch(e){}}prompt('診断結果をコピーしてね',msg)}
render();</script></body></html>
